  sc={id:0,mc:0,tf:0};miss=[];i=0;$('home').hidden=true;$('end').hidden=true;$('stage').hidden=false;show();
}
function hdr(){$('cnt').textContent='Item '+(i+1)+' of '+Q.length+' · '+N[Q[i].k]+' · Score '+(sc.id+sc.mc+sc.tf)}
function show(){
  const {k,x}=Q[i];hdr();$('bar').style.width=(i/Q.length*100)+'%';$('fb').hidden=$('next').hidden=true;
  const box=$('opts');box.innerHTML='';
  if(k==='id'){
    $('pg').textContent='Identification · reviewer p.'+x[2];$('q').textContent=x[0];
    box.innerHTML='<input id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button class="go" id="chk">Check</button>';
    $('a').focus();$('chk').onclick=chkId;$('a').onkeydown=e=>{if(e.key==='Enter')chkId()};
  }else if(k==='pr'){
    $('pg').textContent=x[0];$('q').style.whiteSpace='pre-wrap';$('q').textContent=x[1];
    box.innerHTML='<textarea placeholder="Write your answer here first…"></textarea><button class="go" id="rev">Show model answer</button>';
    $('rev').onclick=()=>{const f=$('fb');f.hidden=false;f.innerHTML='<b>Model answer</b><pre></pre><p></p>';f.querySelector('pre').textContent=x[2];f.querySelector('p').textContent=x[3];nxt()};
  }else{
    $('q').style.whiteSpace='';const o=k==='mc'?x[1]:['True','False'];
    $('pg').textContent=k==='mc'?'Multiple choice · '+x[3]:'True or False · reviewer p.'+x[3];$('q').textContent=x[0];
    o.forEach((t,j)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>pickOpt(b,j,o);box.appendChild(b)});
  }
}
function nxt(){$('next').hidden=false;$('next').textContent=i===Q.length-1?'See results':'Next';$('next').focus()}
function chkId(){
  const x=Q[i].x,u=nz($('a').value);if(!u)return;
  const ok=x[1].split('|').some(a=>{a=nz(a);return u===a||(a.length>6&&u.includes(a))});
  $('a').disabled=$('chk').disabled=true;const f=$('fb');f.hidden=false;
  if(ok){sc.id++;f.innerHTML='<b>✅ Correct!</b><p>Answer: '+x[1].split('|')[0]+' (p.'+x[2]+')</p>'}
  else{const m={k:'id',q:x[0],a:x[1].split('|')[0],p:'p.'+x[2]};miss.push(m);
    f.innerHTML='<b>❌ Not quite.</b><p>Correct answer: <u>'+m.a+'</u> (p.'+x[2]+')</p><button class="go alt" id="ovr" style="margin:0">I was right (spelling or wording)</button>';
    $('ovr').onclick=()=>{sc.id++;miss.splice(miss.indexOf(m),1);$('ovr').remove();hdr()}}
  hdr();nxt();
}
function pickOpt(b,j,o){
  const {k,x}=Q[i],ans=k==='mc'?x[2]:(x[1]?0:1),f=$('fb');
  document.querySelectorAll('#opts button').forEach((e,n)=>{e.disabled=true;if(n===ans)e.classList.add('ok')});f.hidden=false;
  const why=k==='tf'?(x[2]?' '+x[2]:''):'';
  if(j===ans){sc[k]++;f.innerHTML='<b>✅ Correct!</b><p>'+o[ans]+'.'+why+'</p>'}
  else{b.classList.add('no');miss.push({k,q:x[0],a:o[ans]+why,p:k==='mc'?x[3]:'p.'+x[3]});f.innerHTML='<b>❌ Not quite.</b><p>Correct answer: <u>'+o[ans]+'</u>.'+why+'</p>'}
  hdr();nxt();
}
$('next').onclick=()=>{$('q').style.whiteSpace='';i++;i>=Q.length?finish():show()};
function finish(){
  $('bar').style.width='100%';$('stage').hidden=true;$('end').hidden=false;
  const ks=[...new Set(Q.map(e=>e.k))],tot=ks.filter(k=>k!=='pr').reduce((s,k)=>s+D[k].length,0),got=sc.id+sc.mc+sc.tf;
  $('end').innerHTML='<h1>'+got+' / '+tot+(tot?' ('+Math.round(got/tot*100)+'%)':'')+'</h1>'
  +ks.filter(k=>k!=='pr').map(k=>'<p>'+N[k]+': <b>'+sc[k]+' / '+D[k].length+'</b></p>').join('')
  +(ks.includes('pr')?'<p>Problem solving: self-check your answers against the model solutions (20 pts).</p>':'')
  +(miss.length?'<p><b>Items you missed:</b></p><ul>'+miss.map(m=>'<li>'+m.q+' → <b>'+m.a+'</b> ('+m.p+')</li>').join('')+'</ul>':'<p>No mistakes. Perfect run.</p>')
  +'<button class="go" onclick="start('+JSON.stringify(ks).replace(/"/g,"'")+')">Retake (reshuffled)</button><button class="go alt" onclick="home()">Back to menu</button>';
}
home();
</script>
</body>
</html>
